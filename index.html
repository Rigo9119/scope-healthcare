
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1059b5" />

    <!-- Default meta (static, for crawlers/first paint). TanStack Router's
         per-route <head> refines title/description/canonical/hreflang per locale.
         "/" redirects to "/es", so these defaults are Spanish. -->
    <title>Scope Health | Turismo médico en Bogotá — atención de clase mundial</title>
    <meta
      name="description"
      content="Cirugías y tratamientos médicos de alta calidad en Bogotá, Colombia, para pacientes internacionales. Especialistas certificados, precios transparentes y acompañamiento integral."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scope Health" />
    <meta property="og:title" content="Scope Health | Turismo médico en Bogotá" />
    <meta
      property="og:description"
      content="Atención médica de clase mundial en Bogotá para pacientes internacionales."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

    <!-- Structured data for local/medical search. ⚠️ Keep address/phone/hours in
         sync with the "Configuración del sitio" Sanity singleton, and set "url". -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalClinic",
        "name": "Scope Health",
        "url": "https://www.scopehealth.co",
        "description": "Turismo médico en Bogotá, Colombia para pacientes internacionales.",
        "telephone": "+57 (1) 000 0000",
        "email": "hola@scopehealth.co",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Calle 100 #19-61",
          "addressLocality": "Bogotá",
          "addressCountry": "CO"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          "opens": "08:00",
          "closes": "18:00"
        },
        "areaServed": "Worldwide",
        "availableLanguage": ["es", "en"]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
